name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the trace archiving tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ocpp_gateway_test
          POSTGRES_USER: ocpp
          POSTGRES_PASSWORD: ocpp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocpp -d ocpp_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRACE_TEST_POSTGRES_URL: postgresql://ocpp:ocpp@127.0.0.1:5432/ocpp_gateway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installs Node from mise.toml (single source of truth for the version).
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

  # The Cloudflare example is its own package (own tsconfig and Wrangler
  # config), outside the root gates above. Its runtime-agnostic forward.ts is
  # already tested by `npm test`; this checks the Worker entrypoint against the
  # Workers/Containers types and validates wrangler.jsonc. The dry run also
  # builds the container image from the root Dockerfile (no Cloudflare
  # credentials needed, nothing is deployed).
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - run: npm ci

      - run: npm run typecheck

      - run: npm run dry-run

  # Runs the Worker and the gateway image together under `wrangler dev`
  # (workerd + the runner's Docker, no Cloudflare credentials) and drives them
  # end to end with deploy/cloudflare/test/smoke.test.ts. The mock CSMS listen
  # on the runner; the container reaches them at host.docker.internal, which
  # workerd maps to the host gateway.
  cloudflare-smoke:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - run: npm ci

      - run: npm ci
        working-directory: deploy/cloudflare

      - name: Start the Worker and the gateway container
        working-directory: deploy/cloudflare
        run: |
          cp .dev.vars.example .dev.vars
          npm run dev -- --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          for _ in $(seq 1 300); do
            grep -q 'Ready on' "$RUNNER_TEMP/wrangler-dev.log" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/wrangler-dev.log"
          exit 1

      - run: npx vitest run deploy/cloudflare/test/smoke.test.ts
        env:
          SMOKE_GATEWAY_URL: http://127.0.0.1:8787

      - name: Verify Compose deployment contract
        run: bash test/compose-smoke.sh

      - name: Worker and gateway logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/wrangler-dev.log" || true
          for container in $(docker ps -aq --filter name=workerd-ocpp-gateway); do
            docker logs "$container" 2>&1 || true
          done

  build:
    needs: [test, cloudflare, cloudflare-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Pin to semver (+ branch/sha); never publish a mutable `latest`.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Node 24 ships no 32-bit ARM (arm/v7) image, so we target 64-bit only.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
